<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YourWorld - Твій Світ</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* Щоб не було смуг прокрутки */
            background-color: #1a1a1a;
            font-family: sans-serif;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            text-shadow: 1px 1px 2px black;
            pointer-events: none; /* Щоб кліки миші проходили крізь текст у гру */
        }
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            pointer-events: none;
        }
        #style-selector {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.7);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            gap: 10px;
        }
        button {
            background: #444;
            color: white;
            border: 1px solid #666;
            padding: 8px 12px;
            cursor: pointer;
            border-radius: 4px;
        }
        button:hover {
            background: #666;
        }
    </style>
    <!-- Підключаємо Three.js для 3D-графіки -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        <h1>YourWorld V1.0</h1>
        <p>Керування: WASD + Мишка (затиснути ліву кнопку для огляду)</p>
        <p>Будівництво: Клік ЛКМ + Shift (поставити блок)</p>
    </div>

    <div id="crosshair">+</div>

    <!-- Перемикач стилів (Куби / Lego / Реалізм) -->
    <div id="style-selector">
        <button onclick="setWorldStyle('voxel')">Куби (Kogama)</button>
        <button onclick="setWorldStyle('lego')">Lego</button>
        <button onclick="setWorldStyle('realism')">Реалізм</button>
    </div>

    <!-- Підключаємо наші скрипти -->
    <script src="engine.js"></script>
    <script src="client.js"></script>
</body>
</html>
